[package]
name = "seal-c"
description = "Seal's C API (D136)"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "seal_c"
crate-type = ["staticlib", "cdylib", "rlib"]

# IMPLEMENTATION.md, Building rule 2: the one crate allowed `unsafe`, kept to blocks that each say why they're sound.
# Building rule 3's other lints are the workspace's own.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(seal_measure_without_float_checks)'] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
undocumented_unsafe_blocks = "deny"
pedantic = { level = "warn", priority = -1 }

[dependencies]
seal = { path = "../seal" }
